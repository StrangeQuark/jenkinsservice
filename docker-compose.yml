services:
  jenkins-service:
    build: .
    networks:
      - jenkins-network
      - shared-network
    container_name: jenkins-service
    ports:
      - "6080:8080"
      - "50000:50000" # Jenkins agent communication
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
volumes:
  jenkins_home:
networks:
  shared-network:
    external: true
  jenkins-network:
    external: true
